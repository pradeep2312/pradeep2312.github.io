<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio">
  <meta name="theme-color" content="#04050b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-mark" id="loader-mark"></div>
      <div class="loader-bar"><span id="loader-fill"></span></div>
      <div class="loader-row"><span>Lighting the city</span><span id="loader-pct">0%</span></div>
    </div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="nav">
    <a class="brand" href="#hero"><span class="brand-mark" id="brand-mark"></span><span id="brand-name"></span></a>
    <nav class="nav-links" id="nav-links" aria-label="Sections"></nav>
  </header>

  <nav class="dots" id="dots" aria-label="Page progress"></nav>

  <main id="app"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
